site_name: Quad48 Quadruped Robot Control Framework User Manual
site_description: Environment setup, simulation verification, hardware deployment, SDK integration, and LCM development documentation for the Quad48 quadruped robot control framework
site_author: Shandong Yobotics Intelligent Robot Co., Ltd.

use_directory_urls: false

plugins:
  - mkdocs-video
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          build: true
          site_name: Quad48 四足机器人控制框架使用说明书
          site_description: Quad48 四足机器人控制框架的环境配置、仿真验证、实物部署、SDK 二次开发和 LCM 底层开发文档
          theme:
            language: zh
          nav:
            - 首页: index.md
            - 第一部分 环境配置与快速开始:
                - 1.1 软件框架介绍: part-1-quick-start/1.framework.md
                - 1.2 系统要求: part-1-quick-start/2.system-requirements.md
                - 1.3 软件包目录: part-1-quick-start/3.package-directory.md
                - 1.4 初次使用流程: part-1-quick-start/4.first-run.md
            - 第二部分 MuJoCo 仿真与开发验证:
                - 2.1 MuJoCo 仿真的作用: part-2-mujoco/1.purpose.md
                - 2.2 启动仿真: part-2-mujoco/2.start.md
                - 2.3 验证预部署模型: part-2-mujoco/3.verify-model.md
                - 2.4 仿真调试: part-2-mujoco/4.debug.md
            - 第三部分 实物部署、运行、调试:
                - 3.1 实物部署原理: part-3-hardware/1.principle.md
                - 3.2 修改 config: part-3-hardware/2.config.md
                - 3.3 实物机器人部署运行: part-3-hardware/3.deploy-run.md
                - 3.4 实物运行检查与安全停止: part-3-hardware/4.runtime-checks.md
                - 3.5 实物日志开关方式和绘图方式: part-3-hardware/5.logs-and-plots.md
            - 第四部分 SDK 高层二次开发:
                - 4.1 SDK 代码目录与功能: part-4-sdk/1.overview.md
                - 4.2 SDK 编译流程: part-4-sdk/2.build.md
                - 4.3 SDK 运动控制使用流程: part-4-sdk/3.motion-control.md
                - 4.4 SDK 状态读取控制流程: part-4-sdk/4.state-read.md
                - 4.5 SDK 控制仿真例子: part-4-sdk/5.simulation-example.md
                - 4.6 SDK 控制实物例子: part-4-sdk/6.hardware-example.md
                - 4.7 SDK HTTP 控制服务: part-4-sdk/7.http-demo.md
                - 4.8 SDK Demo 使用: part-4-sdk/8.demo-usage.md
            - 第五部分 LCM 底层开发与自研算法包接入:
                - 5.1 LCM 结构: part-5-lcm-dev/1.lcm-structure.md
                - 5.2 LCM 消息定义: part-5-lcm-dev/2.messages.md
                - 5.3 开发包示例: part-5-lcm-dev/3.dev-package-examples.md
                - 5.4 开发者模式: part-5-lcm-dev/4.development-mode.md
                - 5.5 wave_algorithm 关节状态控制模板: part-5-lcm-dev/5.wave-template.md
                - 5.6 walk_algorithm ONNX 仿真部署: part-5-lcm-dev/6.walk-onnx-sim.md
                - 5.7 自研算法实物部署: part-5-lcm-dev/7.hardware-deploy.md
        - locale: en
          default: true
          name: English
          build: true
          site_name: Quad48 Quadruped Robot Control Framework User Manual
          site_description: Environment setup, simulation verification, hardware deployment, SDK integration, and LCM development documentation for the Quad48 quadruped robot control framework
          site_author: Shandong Yobotics Intelligent Robot Co., Ltd.
          theme:
            language: en
          nav:
            - Home: index.md
            - Part 1 Environment Setup and Quick Start:
                - 1.1 Software Framework: part-1-quick-start/1.framework.md
                - 1.2 System Requirements: part-1-quick-start/2.system-requirements.md
                - 1.3 Package Directory: part-1-quick-start/3.package-directory.md
                - 1.4 First Run Workflow: part-1-quick-start/4.first-run.md
            - Part 2 MuJoCo Simulation and Development Verification:
                - 2.1 Purpose of MuJoCo Simulation: part-2-mujoco/1.purpose.md
                - 2.2 Start Simulation: part-2-mujoco/2.start.md
                - 2.3 Verify Predeployed Models: part-2-mujoco/3.verify-model.md
                - 2.4 Simulation Debugging: part-2-mujoco/4.debug.md
            - Part 3 Hardware Deployment, Operation, and Debugging:
                - 3.1 Hardware Deployment Principles: part-3-hardware/1.principle.md
                - 3.2 Update config.yaml: part-3-hardware/2.config.md
                - 3.3 Deploy and Run on a Physical Robot: part-3-hardware/3.deploy-run.md
                - 3.4 Runtime Checks and Safe Stop: part-3-hardware/4.runtime-checks.md
                - 3.5 Logging and Plotting: part-3-hardware/5.logs-and-plots.md
            - Part 4 SDK High-Level Development:
                - 4.1 SDK Directory and Features: part-4-sdk/1.overview.md
                - 4.2 Build the SDK: part-4-sdk/2.build.md
                - 4.3 SDK Motion Control Workflow: part-4-sdk/3.motion-control.md
                - 4.4 SDK State Reading Workflow: part-4-sdk/4.state-read.md
                - 4.5 SDK Simulation Example: part-4-sdk/5.simulation-example.md
                - 4.6 SDK Hardware Example: part-4-sdk/6.hardware-example.md
                - 4.7 SDK HTTP Control Service: part-4-sdk/7.http-demo.md
                - 4.8 SDK Demo Usage: part-4-sdk/8.demo-usage.md
            - Part 5 LCM Low-Level Development and Custom Algorithms:
                - 5.1 LCM Structure: part-5-lcm-dev/1.lcm-structure.md
                - 5.2 LCM Message Definitions: part-5-lcm-dev/2.messages.md
                - 5.3 Development Package Examples: part-5-lcm-dev/3.dev-package-examples.md
                - 5.4 Development Mode: part-5-lcm-dev/4.development-mode.md
                - 5.5 wave_algorithm Joint-Control Template: part-5-lcm-dev/5.wave-template.md
                - 5.6 walk_algorithm ONNX Simulation Deployment: part-5-lcm-dev/6.walk-onnx-sim.md
                - 5.7 Deploy Custom Algorithms on Hardware: part-5-lcm-dev/7.hardware-deploy.md

extra_css:
  - css/custom.css

extra_javascript:
  - js/copy-code.js
  - js/language-switcher.js

theme:
  name: readthedocs
  language: en
  highlightjs: true
  hljs_languages:
    - yaml
    - bash
    - cpp
    - python

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - fenced_code
  - sane_lists

